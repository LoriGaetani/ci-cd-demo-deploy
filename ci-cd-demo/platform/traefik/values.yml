# Values per il chart Helm di Traefik (chart 42.3.1).
# Qui metti SOLO le chiavi che vuoi cambiare rispetto ai default del chart.
# I nomi delle chiavi DEVONO esistere nel values.yaml del chart alla versione
# fissata in apps/traefik.yml: il chart ha uno schema JSON e rifiuta chiavi sconosciute.
# Riferimento: https://github.com/traefik/traefik-helm-chart/blob/v42.3.1/traefik/values.yaml

# Se il cluster è locale (kind, minikube, Docker Desktop) o bare metal senza
# MetalLB, un Service LoadBalancer resta <pending> e ArgoCD vede l'app
# "Progressing" all'infinito. In quel caso scommenta:
# service:
#   spec:
#     type: NodePort

log:
  level: INFO

accessLog:
  enabled: true   # utile in fase di studio: vedi ogni richiesta nei log del pod
